stages:
  - test
  - package
  - release

variables:
  # Disable the Gradle daemon for CI to save memory
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Gradle's dependency/build cache lives here, not in the project dir — without this,
  # the `cache:` block below (which only caches project-relative paths) caches nothing.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# Shared cache configuration to speed up builds
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

# --- Build & test on every push, not just tags — previously only the tag-gated
# packaging jobs below ever ran, so broken Kotlin could land on main/MRs indefinitely.
check:
  stage: test
  image: gradle:jdk25
  tags:
    - saas-linux-small-amd64
  script:
    - ./gradlew :core:check :linuxApp:compileKotlin :windowsApp:backend:compileKotlin

# --- Linux Packaging (Deb, Rpm) ---
package-linux:
  stage: package
  image: gradle:jdk25
  tags:
    - saas-linux-small-amd64
  script:
    - apt-get update && apt-get install -y rpm binutils fakeroot
    - ./gradlew :linuxApp:jpackageDeb :linuxApp:jpackageRpm
  artifacts:
    paths:
      - linuxApp/build/jpackage/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# --- Windows Packaging (MSI, x64 only) ---
# Real MSI via WiX Toolset: dotnet publish (self-contained, complete resolved output —
# unlike `dotnet build`) + a bundled minimal JRE (jlink) so end users need nothing
# preinstalled, wrapped into an installer by windowsApp/packaging/windows/Product.wxs.
package-windows:
  stage: package
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Invoke-WebRequest -Uri "https://download.java.net/java/GA/jdk25.0.1/2fbf10d8c78e40bd87641c434705079d/8/GPL/openjdk-25.0.1_windows-x64_bin.zip" -OutFile "jdk25.zip"
    - Expand-Archive -Path "jdk25.zip" -DestinationPath "C:\jdk25"
    - $env:JAVA_HOME = "C:\jdk25\jdk-25.0.1"
    - $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
    - java -version
    - dotnet tool restore
  script:
    - $env:APP_VERSION = (./gradlew.bat -q printVersion | Select-Object -Last 1).Trim()
    - ./gradlew.bat :windowsApp:backend:fatJar :windowsApp:backend:jlinkRuntime
    - New-Item -ItemType Directory -Force -Path windowsApp\NstkWindowsApp\backend
    - Copy-Item windowsApp\backend\build\libs\nstk-windows-backend.jar windowsApp\NstkWindowsApp\backend\
    - New-Item -ItemType Directory -Force -Path windowsApp\NstkWindowsApp\runtime
    - Copy-Item -Recurse -Force windowsApp\backend\build\runtime\* windowsApp\NstkWindowsApp\runtime\
    - dotnet publish windowsApp\NstkWindowsApp\NstkWindowsApp.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:FileVersion="$env:APP_VERSION.0" -p:AssemblyVersion="$env:APP_VERSION.0" -o windowsApp\NstkWindowsApp\publish
    - dotnet wix build windowsApp\packaging\windows\Product.wxs -d "ProductVersion=$env:APP_VERSION" -d "PublishDir=windowsApp\NstkWindowsApp\publish" -arch x64 -out "nstk-windows-$env:APP_VERSION.msi"
  artifacts:
    paths:
      - nstk-windows-*.msi
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# --- macOS Packaging (DMG, arm64 only, ad-hoc signed) ---
# NOTE: GitLab SaaS macOS runners (tag below) are a distinct, metered/paid tier from
# the Linux/Windows shared-runner pool this project otherwise uses — confirm
# availability/cost against this project's actual GitLab.com plan. If unavailable,
# macosApp/package.sh still works standalone for a maintainer to run locally and
# upload the DMG as a release asset by hand.
package-macos:
  stage: package
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  script:
    - chmod +x macosApp/package.sh
    - ./macosApp/package.sh
  artifacts:
    paths:
      - macosApp/build/dist/*.dmg
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# --- Android Packaging (APK) ---
package-android:
  stage: package
  # Pinned rather than :latest — an unpinned floating tag means the JDK/SDK versions
  # this job builds against (and the D8/R8 behavior in particular) can change under us
  # between otherwise-identical CI runs.
  image: mobiledevops/android-sdk-image:36.1.0
  tags:
    - saas-linux-small-amd64
  script:
    - ./gradlew :androidApp:assembleDebug
  artifacts:
    paths:
      - androidApp/build/outputs/apk/debug/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# --- Release ---
release-job:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
    entrypoint: [""]
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - export VERSION=${CI_COMMIT_TAG#v}
    - export BASE_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw"
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" \
        --description "Released automatically via GitLab CI." \
        --assets-link "{\"name\":\"Android APK\",\"url\":\"${BASE_URL}/androidApp/build/outputs/apk/debug/nstk-android-${VERSION}.apk?job=package-android\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Windows (MSI)\",\"url\":\"${BASE_URL}/nstk-windows-${VERSION}.msi?job=package-windows\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"macOS (DMG, ad-hoc signed)\",\"url\":\"${BASE_URL}/macosApp/build/dist/NS-ToolKit-${VERSION}-macos-arm64.dmg?job=package-macos\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Linux DEB\",\"url\":\"${BASE_URL}/linuxApp/build/jpackage/ns-toolkit_${VERSION}_amd64.deb?job=package-linux\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Linux RPM\",\"url\":\"${BASE_URL}/linuxApp/build/jpackage/ns-toolkit-${VERSION}-1.x86_64.rpm?job=package-linux\",\"link_type\":\"package\"}"
