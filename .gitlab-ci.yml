stages:
  - package
  - release

variables:
  # Disable the Gradle daemon for CI to save memory
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Define the java toolchain (if needed by environment, commonly handled by gradle toolchain)
  JAVA_HOME: ""

# Shared cache configuration to speed up builds
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

# --- Linux Packaging (Deb, Rpm) ---
package-linux:
  stage: package
  image: gradle:jdk25
  tags:
    - saas-linux-small-amd64
  script:
    - apt-get update && apt-get install -y rpm binutils fakeroot
    - ./gradlew :linuxApp:jpackageDeb :linuxApp:jpackageRpm
  artifacts:
    paths:
      - linuxApp/build/jpackage/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# --- Windows Packaging ---
# No MSI/MSIX installer yet (see windowsApp/README.md's known gaps) — this builds the
# JVM backend jar and the WinUI frontend, bundles them together, and ships a zip.
package-windows:
  stage: package
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Invoke-WebRequest -Uri "https://download.java.net/java/GA/jdk25.0.1/2fbf10d8c78e40bd87641c434705079d/8/GPL/openjdk-25.0.1_windows-x64_bin.zip" -OutFile "jdk25.zip"
    - Expand-Archive -Path "jdk25.zip" -DestinationPath "C:\jdk25"
    - $env:JAVA_HOME = "C:\jdk25\jdk-25.0.1"
    - $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
    - java -version
  script:
    - ./gradlew.bat :windowsApp:backend:fatJar
    - New-Item -ItemType Directory -Force -Path windowsApp\NstkWindowsApp\backend
    - Copy-Item windowsApp\backend\build\libs\nstk-windows-backend.jar windowsApp\NstkWindowsApp\backend\
    - dotnet build windowsApp\NstkWindowsApp\NstkWindowsApp.csproj -c Release -p:Platform=x64
    - Compress-Archive -Path windowsApp\NstkWindowsApp\bin\x64\Release\* -DestinationPath nstk-windows.zip
  artifacts:
    paths:
      - nstk-windows.zip
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# macOS packaging isn't wired into this pipeline yet — macosApp ships as the native
# SwiftUI app in /macosApp (`swift build` in that directory) and isn't code-signed/
# notarized or packaged for distribution.

# --- Android Packaging (APK) ---
package-android:
  stage: package
  image: mobiledevops/android-sdk-image:latest
  tags:
    - saas-linux-small-amd64
  script:
    - ./gradlew :androidApp:assembleDebug
  artifacts:
    paths:
      - androidApp/build/outputs/apk/debug/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# --- Release ---
release-job:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
    entrypoint: [""]
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - export VERSION=${CI_COMMIT_TAG#v}
    - export BASE_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw"
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" \
        --description "Released automatically via GitLab CI." \
        --assets-link "{\"name\":\"Android APK\",\"url\":\"${BASE_URL}/androidApp/build/outputs/apk/debug/nstk-android-${VERSION}.apk?job=package-android\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Windows (zip)\",\"url\":\"${BASE_URL}/nstk-windows.zip?job=package-windows\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Linux DEB\",\"url\":\"${BASE_URL}/linuxApp/build/jpackage/ns-toolkit_${VERSION}_amd64.deb?job=package-linux\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Linux RPM\",\"url\":\"${BASE_URL}/linuxApp/build/jpackage/ns-toolkit-${VERSION}-1.x86_64.rpm?job=package-linux\",\"link_type\":\"package\"}"
